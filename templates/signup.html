<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Student Life OS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        "fade-up": "fadeUp 0.7s ease-out"
                    },

                    keyframes: {
                        fadeUp: {
                            "0%": {
                                opacity: "0",
                                transform: "translateY(20px)"
                            },
                            "100%": {
                                opacity: "1",
                                transform: "translateY(0)"
                            }
                        }
                    }
                }
            }
        }
    </script>

</head>


<body class="min-h-screen bg-slate-950 text-white">


<!-- BACKGROUND EFFECTS -->

<div class="fixed inset-0 overflow-hidden pointer-events-none">

    <div
        class="absolute -top-40 -left-40
               w-96 h-96
               bg-indigo-600/20
               rounded-full
               blur-3xl">
    </div>

    <div
        class="absolute bottom-0 right-0
               w-96 h-96
               bg-purple-600/20
               rounded-full
               blur-3xl">
    </div>

</div>



<!-- NAVBAR -->

<nav class="relative border-b border-white/10">

    <div
        class="max-w-7xl mx-auto
               px-6 py-5
               flex items-center
               justify-between">


        <!-- LOGO -->

        <a href="/"
           class="flex items-center gap-3">

            <div
                class="w-11 h-11
                       rounded-xl
                       bg-gradient-to-br
                       from-indigo-500
                       to-purple-600
                       flex items-center
                       justify-center
                       text-2xl">

                📚

            </div>

            <div>

                <h1 class="text-xl font-bold">
                    Student Life OS
                </h1>

                <p class="text-xs text-slate-400">
                    Your Personal Success Hub
                </p>

            </div>

        </a>


        <!-- LOGIN -->

        <a
            href="/login"
            class="px-5 py-2.5
                   rounded-xl
                   bg-white/5
                   border border-white/10
                   hover:bg-white/10
                   transition">

            Login

        </a>

    </div>

</nav>



<!-- SIGNUP SECTION -->

<main
    class="relative min-h-[calc(100vh-89px)]
           flex items-center
           justify-center
           px-6 py-12">


    <div
        class="w-full max-w-lg
               animate-fade-up">


        <!-- SIGNUP CARD -->

        <div
            class="rounded-3xl
                   bg-white/[0.06]
                   border border-white/10
                   backdrop-blur-xl
                   shadow-2xl
                   p-8 md:p-10">


            <!-- ICON + TITLE -->

            <div class="text-center">


                <div
                    class="mx-auto
                           w-16 h-16
                           rounded-2xl
                           bg-gradient-to-br
                           from-indigo-500
                           to-purple-600
                           flex items-center
                           justify-center
                           text-3xl
                           shadow-lg
                           shadow-indigo-600/20">

                    ✨

                </div>


                <h2
                    class="text-3xl
                           font-bold
                           mt-6">

                    Create Your Account

                </h2>


                <p
                    class="text-slate-400
                           mt-2">

                    Start organizing your studies,
                    habits and placement journey.

                </p>

            </div>



            <!-- ERROR -->

            {% if error %}

            <div
                class="mt-6
                       p-4
                       rounded-xl
                       bg-red-500/10
                       border border-red-500/20
                       text-red-300
                       text-sm">

                ⚠️ {{ error }}

            </div>

            {% endif %}



            <!-- SIGNUP FORM -->

            <form method="POST"
                  class="mt-8">


                <!-- FULL NAME -->

                <div>

                    <label
                        class="block
                               text-sm
                               font-medium
                               text-slate-300
                               mb-2">

                        Full Name

                    </label>


                    <div class="relative">

                        <span
                            class="absolute
                                   left-4
                                   top-1/2
                                   -translate-y-1/2
                                   text-lg">

                            👤

                        </span>


                        <input
                            type="text"
                            name="name"
                            placeholder="Enter your full name"
                            required
                            autocomplete="name"
                            class="w-full
                                   rounded-xl
                                   bg-slate-900/80
                                   border border-white/10
                                   px-12 py-3.5
                                   text-white
                                   placeholder-slate-600
                                   outline-none
                                   transition
                                   focus:border-indigo-500
                                   focus:ring-2
                                   focus:ring-indigo-500/20">

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="mt-5">

                    <label
                        class="block
                               text-sm
                               font-medium
                               text-slate-300
                               mb-2">

                        Email Address

                    </label>


                    <div class="relative">

                        <span
                            class="absolute
                                   left-4
                                   top-1/2
                                   -translate-y-1/2
                                   text-lg">

                            📧

                        </span>


                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                            class="w-full
                                   rounded-xl
                                   bg-slate-900/80
                                   border border-white/10
                                   px-12 py-3.5
                                   text-white
                                   placeholder-slate-600
                                   outline-none
                                   transition
                                   focus:border-indigo-500
                                   focus:ring-2
                                   focus:ring-indigo-500/20">

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="mt-5">

                    <label
                        class="block
                               text-sm
                               font-medium
                               text-slate-300
                               mb-2">

                        Password

                    </label>


                    <div class="relative">

                        <span
                            class="absolute
                                   left-4
                                   top-1/2
                                   -translate-y-1/2
                                   text-lg">

                            🔒

                        </span>


                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                            class="w-full
                                   rounded-xl
                                   bg-slate-900/80
                                   border border-white/10
                                   px-12 py-3.5
                                   pr-12
                                   text-white
                                   placeholder-slate-600
                                   outline-none
                                   transition
                                   focus:border-indigo-500
                                   focus:ring-2
                                   focus:ring-indigo-500/20">


                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute
                                   right-4
                                   top-1/2
                                   -translate-y-1/2
                                   text-slate-500
                                   hover:text-white
                                   transition">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="w-full
                           mt-7
                           py-3.5
                           rounded-xl
                           bg-gradient-to-r
                           from-indigo-600
                           to-purple-600
                           hover:from-indigo-500
                           hover:to-purple-500
                           font-semibold
                           shadow-lg
                           shadow-indigo-600/20
                           transition
                           hover:-translate-y-0.5">

                    ✨ Create My Account

                </button>

            </form>



            <!-- DIVIDER -->

            <div class="flex items-center gap-4 my-7">

                <div class="h-px bg-white/10 flex-1"></div>

                <span class="text-xs text-slate-600">
                    STUDENT LIFE OS
                </span>

                <div class="h-px bg-white/10 flex-1"></div>

            </div>



            <!-- LOGIN LINK -->

            <p
                class="text-center
                       text-sm
                       text-slate-400">

                Already have an account?

                <a
                    href="/login"
                    class="text-indigo-400
                           hover:text-indigo-300
                           font-semibold
                           transition">

                    Login here

                </a>

            </p>


        </div>


        <!-- BACK HOME -->

        <div class="text-center mt-6">

            <a
                href="/"
                class="text-sm
                       text-slate-500
                       hover:text-slate-300
                       transition">

                ← Back to Student Life OS

            </a>

        </div>


    </div>

</main>



<!-- PASSWORD SCRIPT -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>


</body>

</html>
