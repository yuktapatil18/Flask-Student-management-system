<!DOCTYPE html>
<html>

<head>

    <title>Student Life OS</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- Sidebar -->

    <div class="w-64 bg-white shadow-lg">

        <div class="p-6">

            <h1 class="text-2xl font-bold">

                📚 Student Life OS

            </h1>

        </div>

        <nav class="mt-6">

            <a href="/dashboard_v2"
               class="block px-6 py-3 hover:bg-gray-100">

            </a>

            <a href="/study_v2"
               class="block px-6 py-3 hover:bg-gray-100">

            </a>

            <a href="/habit_v2"
               class="block px-6 py-3 hover:bg-gray-100">

            </a>

            <a href="/fitness_v2"
               class="block px-6 py-3 hover:bg-gray-100">

                💪 Fitness

            </a>

            <a href="/mood_v2"
               class="block px-6 py-3 hover:bg-gray-100">

                😊 Mood

            </a>

            <a href="/analytics_v2"
               class="block px-6 py-3 hover:bg-gray-100">

                📈 Analytics

            </a>

            <a href="/logout"
               class="block px-6 py-3 text-red-600 hover:bg-red-50">

                🚪 Logout

            </a>

    <div class="flex-1 p-8">

        {% block content %}

        {% endblock %}

    </div>

</html>
