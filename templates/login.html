<!DOCTYPE html>
<html>

<head>
    <title>Login - Student Life OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="header-banner auth-banner">
            <h1>🔐 Welcome Back</h1>
            <p>Enter your credentials and continue your prep journey</p>
        </div>

        <form method="POST">
            <h2 class="auth-title text-center">Login to Your Account</h2>

            <input
                type="email"
                name="email"
                placeholder="📧 Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="🔒 Password"
                required>

            <button type="submit" class="btn btn-wide mt-10">
                🚀 Login to Dashboard
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/signup">Sign up here</a>
        </p>
    </div>
</body>

</html>
